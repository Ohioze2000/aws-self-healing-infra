name: "Terraform AWS Deploy"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Prevent parallel runs on the same branch to avoid state locks on TFC
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  terraform:
    name: "Terraform Cloud Run Engine"
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
    
    env:
      TF_CLOUD_ORGANIZATION: "DigitalTech"
      TF_WORKSPACE: "awsSelfHealingInfra"
      AWS_DEFAULT_REGION: "us-east-1"
      AWS_REGION: "us-east-1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      # --- PIPELINE INITIALIZATION SLACK ALERT ---
      - name: Slack Notification - Started
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: 'good'
          SLACK_TITLE: "Infrastructure Pipeline Status: STARTED"
          SLACK_MESSAGE: "🚀 Triggered native Terraform Cloud remote run execution."  

      # GitHub OIDC provides short-lived AWS credentials for runner-side AWS operations.
      # Terraform plan/apply still execute in HCP Terraform, which should use HCP
      # Terraform dynamic AWS provider credentials configured on the workspace.
      - name: Configure AWS Credentials (OIDC)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Verify AWS OIDC Identity
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: aws sts get-caller-identity

      - name: Terraform Init
        run: terraform init 

      # --- SYNTAX & FORMATTING QUALITY GATES ---
      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate  

      # Speculative Plan triggers automatically in TFC during PRs
      # - name: Terraform Plan
      #   if: github.event_name == 'pull_request'
      #   run: terraform plan -input=false

      # Remote Apply on merge to main branch
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform destroy -auto-approve -input=false

      # Retrieve actual outputs. Never hide errors or silently use empty values.
      - name: Capture Infrastructure Outputs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: tf_outputs
        shell: bash
        run: |
          set -euo pipefail

          get_output() {
            local name="$1"
            local value

            if ! value="$(terraform output -raw "$name")"; then
              echo "::error::Unable to retrieve Terraform output: $name"
              echo "Check the Terraform Cloud workspace, completed run, and remote state access."
              exit 1
            fi

            if [[ -z "$value" || "$value" == "null" ]]; then
              echo "::error::Terraform output '$name' is empty or null."
              exit 1
            fi

            printf '%s' "$value"
          }

          URL="$(get_output website_url)"
          DOMAIN_NAME="$(get_output domain_name)"
          ALB_ARN="$(get_output alb_arn)"
          TARGET_GROUP_ARN="$(get_output target_group_arn)"
          EC2_SG_ID="$(get_output ec2_security_group_id)"
          ALB_DNS="$(get_output alb_dns_name)"

          {
            echo "URL=$URL"
            echo "DOMAIN_NAME=$DOMAIN_NAME"
            echo "ALB_ARN=$ALB_ARN"
            echo "TARGET_GROUP_ARN=$TARGET_GROUP_ARN"
            echo "EC2_SG_ID=$EC2_SG_ID"
            echo "ALB_DNS=$ALB_DNS"
          } >> "$GITHUB_OUTPUT"

          echo "Terraform infrastructure outputs retrieved successfully."
          echo "Application domain: $DOMAIN_NAME"
          echo "EC2 Security Group ID: $EC2_SG_ID"
          echo "ALB DNS name: $ALB_DNS"

      - name: Initialize Python Environment
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Runtime Verification Dependencies
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          python -m pip install --upgrade pip
          python -m pip install boto3 requests urllib3

      - name: Verify Infrastructure Outputs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          EC2_SECURITY_GROUP_ID: ${{ steps.tf_outputs.outputs.EC2_SG_ID }}
          TARGET_GROUP_ARN: ${{ steps.tf_outputs.outputs.TARGET_GROUP_ARN }}
          APP_ENDPOINT: ${{ steps.tf_outputs.outputs.URL }}
          DOMAIN_NAME: ${{ steps.tf_outputs.outputs.DOMAIN_NAME }}
          ALB_DNS_NAME: ${{ steps.tf_outputs.outputs.ALB_DNS }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$EC2_SECURITY_GROUP_ID" || {
            echo "::error::EC2_SECURITY_GROUP_ID is missing."
            exit 1
          }

          test -n "$TARGET_GROUP_ARN" || {
            echo "::error::TARGET_GROUP_ARN is missing."
            exit 1
          }

          if [[ -z "$APP_ENDPOINT" && -z "$DOMAIN_NAME" && -z "$ALB_DNS_NAME" ]]; then
            echo "::error::No application endpoint is configured."
            exit 1
          fi

          echo "All required infrastructure outputs are present."

      - name: Execute Infrastructure Verification Engine
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          AWS_DEFAULT_REGION: "us-east-1"
          DOMAIN_NAME: ${{ steps.tf_outputs.outputs.DOMAIN_NAME }}
          APP_ENDPOINT: ${{ steps.tf_outputs.outputs.URL }}
          ALB_ARN: ${{ steps.tf_outputs.outputs.ALB_ARN }}
          TARGET_GROUP_ARN: ${{ steps.tf_outputs.outputs.TARGET_GROUP_ARN }}
          EC2_SECURITY_GROUP_ID: ${{ steps.tf_outputs.outputs.EC2_SG_ID }}
          ALB_DNS_NAME: ${{ steps.tf_outputs.outputs.ALB_DNS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ENV_PREFIX: "prod"
        run: python validate_infra.py

      # --- FINAL PIPELINE SUCCESS NOTIFICATION ---
      - name: Slack Notification - Success
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: 'good'
          SLACK_TITLE: "✅ Deployment & Infrastructure Verification SUCCESSFUL"
          SLACK_MESSAGE: "All quality gate checks passed. Active deployment live at: ${{ steps.tf_outputs.outputs.URL }}"

      # --- COMPREHENSIVE PIPELINE FAILURE NOTIFICATION ---
      - name: Slack Notification - Failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: 'danger'
          SLACK_TITLE: "❌ Infrastructure Pipeline Status: FAILED"
          SLACK_MESSAGE: "Infrastructure Provisioning, App Deployment, or Quality Gate Validation FAILED. Inspect GitHub workflow runner logs."